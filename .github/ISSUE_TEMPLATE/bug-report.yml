name: Bug report
description: Report a reproducible problem in Hermes Cockpit
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove secrets, private hostnames, LAN/Tailscale addresses, session IDs, personal browser data, and sensitive screenshots. Security vulnerabilities belong in the [private reporting form](https://github.com/Judge-M/HermesCockpit/security/advisories/new), not here.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and pull requests for this problem.
          required: true
        - label: This report does not disclose a security vulnerability or sensitive data.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
      placeholder: A clear description of the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest sequence that reliably reproduces the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: cockpit-version
    attributes:
      label: Hermes Cockpit revision
      description: Commit SHA, tag, or branch. Find the SHA with `git rev-parse HEAD`.
      placeholder: abc1234
    validations:
      required: true
  - type: input
    id: hermes-version
    attributes:
      label: Hermes Agent version and revision
      placeholder: 0.21.7 / commit SHA, or not applicable
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker Compose reverse proxy
        - Existing reverse proxy
        - Local preview only
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser/version, client OS, server OS, and relevant non-secret configuration.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Paste only the minimum needed. Redact tokens, cookies, IDs, prompts, private URLs, and personal data.
      render: shell
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Include frequency, workarounds, regressions, and related issues.
