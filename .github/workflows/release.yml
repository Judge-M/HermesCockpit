name: Publish Hermes Cockpit release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkout official Hermes v0.21.7
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NousResearch/hermes-agent
          ref: v0.21.7
          path: build/hermes-v0.21.7
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run backend regression tests
        run: python -m unittest discover -s tests/backend -v
      - name: Validate semantic routing contract
        run: python scripts/validate-semantic-routing.py
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run portable validators
        run: sh tests/ci/verify-portable.sh
      - name: Verify runtime patches against Hermes v0.21.7
        run: sh tests/ci/verify-hermes-v0.21.7.sh build/hermes-v0.21.7
      - name: Run browser smoke tests
        run: npm run test:e2e
      - name: Verify Compose and nginx runtime
        run: sh tests/ci/smoke-compose.sh

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build release archives and checksums
        run: python build.py --release --output build/release
      - name: Validate release output contract
        run: |
          version=$(tr -d '\r\n' < VERSION)
          test "$GITHUB_REF_NAME" = "v${version}"
          test -f "build/release/hermes-cockpit-${version}.zip"
          test -f "build/release/hermes-cockpit-${version}.tar.gz"
          test -f build/release/SHA256SUMS.txt
          grep -Fq "hermes-cockpit-${version}.zip" build/release/SHA256SUMS.txt
          grep -Fq "hermes-cockpit-${version}.tar.gz" build/release/SHA256SUMS.txt
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(tr -d '\r\n' < VERSION)
          gh release create "$GITHUB_REF_NAME" \
            "build/release/hermes-cockpit-${version}.zip" \
            "build/release/hermes-cockpit-${version}.tar.gz" \
            build/release/SHA256SUMS.txt \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
