services:
  cockpit:
    image: nginx:1.27.5-alpine
    container_name: hermes-cockpit
    restart: unless-stopped
    ports:
      - "${COCKPIT_PORT:-8088}:80"
    environment:
      HERMES_UPSTREAM: "${HERMES_UPSTREAM:-http://host.docker.internal:9119}"
      NGINX_ENVSUBST_FILTER: HERMES_UPSTREAM
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./dist:/usr/share/nginx/html/cockpit:ro
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q '^ok$'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
