<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="shell-type" content="web_dashboard">
  <title>Hermes Cockpit — Live Control</title>
  <link href="vendor/fonts.css" rel="stylesheet">
  <link href="vendor/material-symbols.css" rel="stylesheet">
  <link href="vendor/xterm/xterm.css" rel="stylesheet">
  <script src="vendor/tailwindcss-cdn.js"></script>
  <script src="live-control-tailwind.js"></script>
  <link rel="stylesheet" href="live-control.css">
</head>
<body data-hermes-client="true" data-hermes-base="/hermes" data-client-mode="chat" class="font-sans">
  <div id="shared-header"></div>
  <div id="shared-sidebar"></div>
  <main class="live-layout" data-workspace="true">
    <aside id="live-session-sidebar" class="live-session-side"><div class="live-loading">Loading chats…</div></aside>
    <section class="live-main">
      <div id="execution-feed"><div class="live-loading">Connecting to Hermes…</div></div>
      <div class="live-composer" aria-label="Hermes prompt composer">
        <textarea id="composer-input" placeholder="Type a message or / for Hermes commands…" aria-label="Type a message or Hermes command"></textarea>
        <button id="voice-input" type="button" title="Dictate a prompt"><span class="material-symbols-outlined">mic</span><span>Voice</span></button>
        <button id="attach-source" type="button" title="Attach a source file"><span class="material-symbols-outlined">attach_file</span><span>Attach</span></button>
        <input id="source-file-input" class="hidden" type="file" multiple>
        <button id="execute-prompt" class="send" type="button"><span>Send</span><span class="material-symbols-outlined">send</span></button>
      </div>
    </section>
    <aside id="live-control-sidebar" class="live-side"><div class="live-loading">Loading controls…</div></aside>
  </main>
  <div id="demo-notice" class="hidden" aria-live="polite"></div>
  <script src="live-control-page.js"></script>
  <script src="live-control-context.js"></script>
  <script src="shell-data.js?v=20261015h"></script>
  <script src="shell.js?v=20261017d"></script>
  <script src="vendor/xterm/xterm.js"></script>
  <script src="hermes-client.js?v=20261017f"></script>
  <link rel="stylesheet" href="prototype.css?v=20261017b">
  <link rel="stylesheet" href="hermes-client.css?v=20261017f">
</body>
</html>
